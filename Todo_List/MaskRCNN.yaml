---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 224x224

MODEL:
  # A parameter to control model complexity 
  # (i.e. number of trainable parameters)
  NB_CHANNEL: 3
  NB_CLASSES: 1
  # RPN_ANCHOR_SCALES: 32, 64, 128, 256, 512
  # RPN_ANCHOR_RATIOS: 0.5, 1, 2
  # RPN_ANCHOR_STRIDE: 1
  # BACKBONE_STRIDES: 4, 8, 16, 32, 64
  
TRAINING: 
  LEARNING_RATE: 0.001
  EPOCH: 100
  BATCH_SIZE: 8
  # cpu (to run on cpu) or cuda (to run on gpu)
  DEVICE: cuda

EVALUATE:
  IMAGE_SIZE: 224