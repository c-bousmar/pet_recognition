---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 224x224

MODEL:
  # A parameter to control model complexity 
  # (i.e. number of trainable parameters)
  NB_CHANNEL: 3
  NB_CLASSES: 1
  
TRAINING: 
  LEARNING_RATE: 0.001
  EPOCH: 30
  BATCH_SIZE: 1
  # cpu (to run on cpu) or cuda (to run on gpu)
  DEVICE: cuda

EVALUATE:
  EPOCH_NUMBER: 12