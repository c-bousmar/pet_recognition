---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 256x256

MODEL:
  # A parameter to control model complexity 
  # (i.e. number of trainable parameters)
  NB_CHANNEL: 3
  NB_CLASSES: 1
  
TRAINING: 
  LEARNING_RATE: 0.001
  EPOCH: 100
  BATCH_SIZE: 16
  # cpu (to run on cpu) or cuda (to run on gpu)
  DEVICE: cuda 