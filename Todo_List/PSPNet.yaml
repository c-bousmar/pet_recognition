---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 224x224

MODEL:
  # A parameter to control model complexity 
  # (i.e. number of trainable parameters)
  NB_CHANNEL: 3
  NB_CLASSES: 1
  # NB_CLASSES: 21
  OUT_CHANNELS: 2048
  
TRAINING: 
  LEARNING_RATE: 0.01
  EPOCH: 3
  BATCH_SIZE: 8
  # cpu (to run on cpu) or cuda (to run on gpu)
  DEVICE: cuda

EVALUATE:
  IMAGE_SIZE: 224
  EPOCH_NUMBER: 13